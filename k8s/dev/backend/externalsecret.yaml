apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rustdeploy-backend-encryption-key
  namespace: storefront-rust
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: t5-dev/storefront-rust/ENCRYPTION_KEY
